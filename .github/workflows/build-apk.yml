name: Build APK si EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CalculSchela.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CalculSchela-apk
          path: CalculSchela.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Calcul Schelă v1.0.${{ github.run_number }}
          make_latest: true
          files: CalculSchela.apk
          body: |
            Calcul Schelă (Giovani Construct).
            - Android: CalculSchela.apk – descarcă pe telefon și instalează (permite „surse necunoscute” dacă îți cere).
            - Windows: CalculSchela-Setup.exe (instalare cu scurtătură pe desktop) sau CalculSchela-Portable.exe (pornește direct, fără instalare).

  exe:
    needs: build
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Copiază calculatorul
        shell: bash
        run: cp app/src/main/assets/index.html desktop/index.html
      - name: Instalează și construiește
        working-directory: desktop
        shell: bash
        run: |
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
          npm install --no-audit --no-fund
          npx electron-builder --win portable nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: CalculSchela-exe
          path: |
            desktop/dist/CalculSchela-Setup.exe
            desktop/dist/CalculSchela-Portable.exe
      - name: Adaugă în release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            desktop/dist/CalculSchela-Setup.exe
            desktop/dist/CalculSchela-Portable.exe
